[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "inventory-optimizer-api"
version = "0.1.0"
description = "Bounded API adapter between QuantMeridian and InventoryBallast."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.3.2",
  "openpyxl==3.1.5",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "scipy==1.18.1",
  "pyyaml==6.0.2",
  "uvicorn[standard]==0.35.0",
]
# The InventoryBallast engine is not a hard dependency: supply it from a local checkout
# (INVENTORY_OPTIMIZER_ENGINE_PATH), a pip install from a path, wheel or index, or one of the
# extras below. Readiness checks the installed code against capability-manifest.json either way.

[project.optional-dependencies]
engine = [
  "inventory-optimizer==0.1.0",
]
engine-github = [
  "inventory-optimizer @ git+https://github.com/thatquantguy44/InventoryBallast.git@a42dad30dc3ebb80d2790fd8701e621af0a35fcb",
]
highs = [
  "highspy==1.15.1",
]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.138.2",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_optimizer_api"]

[tool.hatch.build.targets.wheel.force-include]
"capability-manifest.json" = "inventory_optimizer_api/capability-manifest.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
