[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmeridian-collateral-optimizer-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "collateral-optimizer==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
