name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: QuantSmith pin record (spec009)
        run: bash scripts/check-quantsmith-pin.sh

      - name: Agent Skills pin (spec012)
        run: npm run check:agent-skills-pin

      - name: Metric registry is up to date (spec009)
        run: npm run check:agent-metric-registry

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Seed of spec009 T-026: worker lint, hosted tests, and contract generation drift. The
  # needs_quantsmith suites are skipped here (QuantSmith is a local checkout, never fetched) and
  # run in `npm run verify:agent` on the owner's machine.
  agent-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install -e "services/agent_worker[dev]"

      - name: Contract generation is up to date
        run: npm run check:agent-contracts

      - name: Worker lint
        run: |
          cd services/agent_worker
          ruff check .
          ruff format --check .

      - name: Worker tests (needs_quantsmith suites skipped)
        run: |
          cd services/agent_worker
          pytest -m "not needs_quantsmith" -rs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test test/smoke.spec.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
